<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>PROJECT EREBUS: SUB-LEVEL 9</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020406;
      font-family: 'Courier New', Courier, monospace;
      color: #c8d6e5;
    }

    #game-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Subtle CRT / Visor Vignette */
    #visor-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at center, transparent 55%, rgba(0, 5, 10, 0.85) 100%);
    }

    /* Tactical HUD Layer */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      padding: env(safe-area-inset-top, 14px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .panel {
      background: rgba(6, 12, 18, 0.65);
      border: 1px solid rgba(100, 180, 220, 0.25);
      backdrop-filter: blur(4px);
      padding: 8px 12px;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
    }

    .sys-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #5f87a0;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .objective-text {
      font-size: 12px;
      font-weight: bold;
      color: #e0f2fe;
      letter-spacing: 0.5px;
    }

    .objective-sub {
      font-size: 11px;
      color: #38bdf8;
      margin-top: 2px;
    }

    /* Battery & Stamina Bars */
    .telemetry-box {
      min-width: 145px;
      text-align: right;
    }

    .bar-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(100, 180, 220, 0.3);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    #battery-fill {
      width: 100%;
      height: 100%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      transition: width 0.1s linear, background-color 0.2s ease;
    }

    #stamina-fill {
      width: 100%;
      height: 100%;
      background: #94a3b8;
      transition: width 0.1s linear;
    }

    #fps-counter {
      font-size: 10px;
      color: #4ade80;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Center Reticle */
    #reticle {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      transform: translate(-50%, -50%);
      background: rgba(200, 230, 255, 0.45);
      border-radius: 50%;
      z-index: 5;
      pointer-events: none;
    }

    /* Dynamic Virtual Joystick Ring */
    #joystick-zone-visual {
      position: fixed;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(56, 189, 248, 0.06);
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      z-index: 8;
    }

    #joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.3);
      border: 1px solid rgba(186, 230, 253, 0.6);
      transform: translate(-50%, -50%);
    }

    /* Bottom Mobile Controls */
    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .touch-hint {
      font-size: 10px;
      color: rgba(148, 163, 184, 0.55);
      letter-spacing: 1px;
      max-width: 160px;
    }

    .action-cluster {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .tac-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(10, 20, 30, 0.55);
      border: 1.5px solid rgba(56, 189, 248, 0.45);
      color: #bae6fd;
      font-family: inherit;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .tac-btn:active, .tac-btn.active {
      background: rgba(56, 189, 248, 0.28);
      border-color: #7dd3fc;
      transform: scale(0.94);
    }

    .tac-btn.off {
      border-color: rgba(148, 163, 184, 0.25);
      color: #64748b;
    }

    /* Start Overlay for Pointer Lock / Fullscreen Touch */
    #boot-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(2, 4, 7, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    #boot-screen h1 {
      font-size: 20px;
      letter-spacing: 3px;
      color: #e0f2fe;
      margin-bottom: 8px;
    }

    #boot-screen p {
      font-size: 12px;
      color: #64748b;
      max-width: 340px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    #btn-deploy {
      padding: 14px 28px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      color: #e0f2fe;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="visor-vignette"></div>
  <div id="reticle"></div>

  <div id="joystick-zone-visual">
    <div id="joystick-knob"></div>
  </div>

  <div id="hud">
    <div class="hud-top">
      <div class="panel">
        <div class="sys-label">SUB-LEVEL 9 // CONTAINMENT</div>
        <div class="objective-text" id="objective-main">LOCATE OVERRIDE KEYCARDS</div>
        <div class="objective-sub" id="objective-count">KEYCARDS RECOVERED: 0 / 3</div>
      </div>

      <div class="panel telemetry-box">
        <div class="sys-label">TORCH CELL</div>
        <div class="bar-track"><div id="battery-fill"></div></div>
        <div class="sys-label" style="margin-top: 6px;">STAMINA</div>
        <div class="bar-track"><div id="stamina-fill"></div></div>
        <div id="fps-counter">SYS: 60 FPS</div>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="touch-hint">
        LEFT THUMB: MOVE<br />
        RIGHT THUMB: LOOK
      </div>
      <div class="action-cluster">
        <button id="btn-sprint" class="tac-btn">SPRINT</button>
        <button id="btn-light" class="tac-btn active">LIGHT<br />ON</button>
      </div>
    </div>
  </div>

  <div id="boot-screen">
    <h1>PROJECT EREBUS</h1>
    <p>SUB-LEVEL 9 BIOMETRIC INTERFACE.<br />Acoustic hazard detected. Minimize sprint decibels and conserve tactical torch battery.</p>
    <button id="btn-deploy">INITIALIZE NEURAL LINK</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
